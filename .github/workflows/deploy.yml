name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest code
        run: |
          set -e

          cd /home/flexieng/Documents/backend

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          /home/flexieng/Documents/backend/.venv/bin/python -m pip install -r requirements.txt

          echo "Restarting backend..."
          sudo -n /usr/bin/systemctl restart flexicare-backend

          echo "Checking backend status..."
          sudo -n /usr/bin/systemctl is-active --quiet flexicare-backend

          echo "Testing health endpoint..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:3000/health; then
              echo
              echo "Backend health check passed!"
              break
            fi

            echo "Backend is starting... attempt $i/15"
            sleep 2

            if [ "$i" -eq 15 ]; then
              echo "Backend health check failed."
              sudo -n /usr/bin/systemctl status flexicare-backend --no-pager -l
              exit 1
            fi
          done

          echo "Backend deployment completed!"
